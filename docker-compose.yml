services:
  postgres:
    image: postgres:17-alpine
    container_name: tab-postgres
    environment:
      POSTGRES_USER: tab
      POSTGRES_PASSWORD: tab
      POSTGRES_DB: tab
    ports:
      # 5433 on the host so this never collides with a local Postgres.
      - "5433:5432"
    volumes:
      - tab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tab -d tab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tab-pgdata:
